name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # SHA-256 of the signing certificate that tag builds are expected to carry.
  # Set the EXPECTED_SIGNER_SHA256 repository variable to this fork's release
  # certificate to enable the check; when unset or when no keystore secret is
  # available (e.g. pull requests), the verification step is skipped.
  EXPECTED_SIGNER_SHA256: ${{ vars.EXPECTED_SIGNER_SHA256 }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Lets the failure-report step comment the failing log tail on the PR.
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every Gradle step below pipes its output into `tee`, so it needs
      # `set -o pipefail` plus an explicit `|| rc=$?`: without them the step
      # reports the exit status of `tee` (always 0) and a broken build walks
      # through CI unnoticed, failing later on a missing APK instead.
      - name: Check Kotlin formatting
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew spotlessCheck --build-cache --stacktrace 2>&1 | tee /tmp/ci-spotless.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-spotless.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            # spotlessCheck only says "these files had violations". Re-run the
            # formatter and capture the diff it wanted, so the failure comment
            # names the exact lines instead of just the file list.
            ./gradlew spotlessApply --build-cache > /tmp/ci-spotless-apply.log 2>&1 || true
            {
              echo "### what spotlessApply wanted to change"
              git --no-pager diff --stat
              git --no-pager diff
            } > /tmp/ci-spotless-diff.log 2>&1 || true
            exit "$rc"
          done

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # A tag build publishes to GitHub Releases. Without the keystore,
            # app/build.gradle.kts falls back to signingConfig = null and
            # produces UNSIGNED APKs, which cannot be installed as updates.
            echo "::error::RELEASE_KEYSTORE_BASE64 is unavailable for a tag build. Refusing to publish unsigned APKs."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned CI build."
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest \
              --parallel --build-cache --stacktrace 2>&1 | tee /tmp/ci-unit-tests.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-unit-tests.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Compile instrumentation tests
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:compileGithubDebugAndroidTestKotlin --build-cache --stacktrace 2>&1 | tee /tmp/ci-androidtest-compile.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-androidtest-compile.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:lintGithubNightly --build-cache --stacktrace 2>&1 | tee /tmp/ci-lint.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-lint.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:lintGithubRelease --build-cache --stacktrace 2>&1 | tee /tmp/ci-lint.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-lint.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done

      - name: Build CI APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:assembleGithubRelease :app:assembleGithubNightly :app:assembleFossRelease \
              --parallel --build-cache --stacktrace 2>&1 | tee /tmp/ci-assemble.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-assemble.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== attempt $attempt ==="
            rc=0
            ./gradlew :app:assembleGithubRelease :app:assembleFossRelease \
              --parallel --build-cache --stacktrace 2>&1 | tee /tmp/ci-assemble.log || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/ci-assemble.log && [ "$attempt" -lt 3 ]; then
              attempt=$((attempt + 1))
              echo "Transient network/dependency failure (exit $rc); retrying in $((attempt * 45))s..."
              sleep $((attempt * 45))
              continue
            fi
            exit "$rc"
          done
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Guards the update path for installed clients: a wrong or missing key
      # here is unrecoverable for installed users, so fail the build rather
      # than publish. Only runs when a keystore was decoded AND the fork set
      # EXPECTED_SIGNER_SHA256 to its own release certificate.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' && vars.EXPECTED_SIGNER_SHA256 != '' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          status=0
          for apk in \
            app/build/outputs/apk/github/release/app-github-universal-release.apk \
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk \
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-universal-release.apk \
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Checksum nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Nightly universal APK not found at $apk"
            find app/build/outputs/apk -type f -name '*.apk' -printf 'found: %p\n' 2>/dev/null | sort
            exit 1
          fi
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/github/release/app-github-universal-release*.apk
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          )
          expected=6

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
            echo
            echo '> GitHub and FOSS APKs are uploaded individually without compression. Nightly remains a compressed artifact on regular CI runs.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Log bridge for log-restricted environments: when any Gradle step
      # fails, post the tail of the most recently written captured log to the
      # PR (or the step summary outside PRs) so the failure is diagnosable
      # without access to the Actions log CDN. No-op on success.
      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          f=$(ls -t /tmp/ci-*.log 2>/dev/null | head -1 || true)
          if [ -z "${f:-}" ]; then
            echo "No captured Gradle log found."
            exit 0
          fi
          {
            echo "### CI failure: \`$(basename "$f")\`"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '#### Error highlights'
            echo
            for lf in $(ls -t /tmp/ci-*.log 2>/dev/null); do
              case "$(basename "$lf")" in ci-spotless-diff.log) continue ;; esac
              echo "== $(basename "$lf") =="
              echo '```'
              grep -inE '^(e|error|warning): |> Task .*FAILED|FAILED$|Caused by|Execution failed|What went wrong|material3:1\.|compose-bom' "$lf" | grep -vE 'at (org|java|jdk)\.' | tail -40
              echo '```'
              echo
            done
            if [ -s /tmp/ci-spotless-diff.log ]; then
              echo '#### What the Kotlin formatter wanted to change'
              echo
              echo '```diff'
              head -c 24000 /tmp/ci-spotless-diff.log
              echo '```'
              echo
            fi
            echo '<details><summary>Log tail</summary>'
            echo
            echo '```'
            tail -n 200 "$f"
            echo '```'
            echo '</details>'
          } > /tmp/ci-comment.md
          if [ "$(wc -c < /tmp/ci-comment.md)" -gt 65000 ]; then
            {
              echo "### CI failure: log tail of \`$(basename "$f")\` (truncated)"
              echo
              echo '```'
              tail -c 60000 "$f"
              echo '```'
            } > /tmp/ci-comment.md
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_number=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
            if [ -n "$pr_number" ]; then
              gh pr comment "$pr_number" --body-file /tmp/ci-comment.md || true
              exit 0
            fi
          fi
          cat /tmp/ci-comment.md >> "$GITHUB_STEP_SUMMARY" || true

      # The universal APKs are what release downloads link to.
      - name: Upload GitHub universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-universal-release-apk
          path: app/build/outputs/apk/github/release/app-github-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-armeabi-v7a-release-apk
          path: app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-nightly-apk
          path: |
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-universal-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-arm64-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: flowtube-*-release-apk
          path: dist/
          merge-multiple: true

      # The flowtube-*.apk asset names are a public contract: release download
      # links and any third-party update feeds match assets by file name.
      # Do not rename or drop them without updating those references first.
      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mv dist/app-github-universal-release.apk   dist/flowtube.apk
          mv dist/app-foss-universal-release.apk     dist/flowtube-foss.apk
          mv dist/app-github-arm64-v8a-release.apk   dist/flowtube-arm64-v8a.apk
          mv dist/app-github-armeabi-v7a-release.apk dist/flowtube-armeabi-v7a.apk
          mv dist/app-foss-arm64-v8a-release.apk     dist/flowtube-foss-arm64-v8a.apk
          mv dist/app-foss-armeabi-v7a-release.apk   dist/flowtube-foss-armeabi-v7a.apk

      - name: Generate checksums
        run: |
          cd dist
          sha256sum flowtube*.apk > checksums.txt
          cat checksums.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          test -s release-notes.md
          grep -Fqx "# Flow ${RELEASE_VERSION}" release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Flow ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/flowtube.apk
            dist/flowtube-foss.apk
            dist/flowtube-arm64-v8a.apk
            dist/flowtube-armeabi-v7a.apk
            dist/flowtube-foss-arm64-v8a.apk
            dist/flowtube-foss-armeabi-v7a.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
