name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # SHA-256 of the signing certificate that tag builds are expected to carry.
  # Set the EXPECTED_SIGNER_SHA256 repository variable to this fork's release
  # certificate to enable the check; when unset or when no keystore secret is
  # available (e.g. pull requests), the verification step is skipped.
  EXPECTED_SIGNER_SHA256: ${{ vars.EXPECTED_SIGNER_SHA256 }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # A tag build publishes to GitHub Releases. Without the keystore,
            # app/build.gradle.kts falls back to signingConfig = null and
            # produces UNSIGNED APKs, which cannot be installed as updates.
            echo "::error::RELEASE_KEYSTORE_BASE64 is unavailable for a tag build. Refusing to publish unsigned APKs."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned CI build."
          fi

      - name: Run unit tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          --parallel --build-cache --stacktrace

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Compile instrumentation tests
        run: >
          ./gradlew :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubNightly
          --build-cache --stacktrace

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubRelease
          --build-cache --stacktrace

      - name: Build CI APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleGithubNightly :app:assembleFossRelease
          --parallel --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleFossRelease
          --parallel --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Guards the update path for installed clients: a wrong or missing key
      # here is unrecoverable for installed users, so fail the build rather
      # than publish. Only runs when a keystore was decoded AND the fork set
      # EXPECTED_SIGNER_SHA256 to its own release certificate.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' && vars.EXPECTED_SIGNER_SHA256 != '' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          status=0
          for apk in \
            app/build/outputs/apk/github/release/app-github-universal-release.apk \
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk \
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-universal-release.apk \
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Checksum nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test -f app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
          sha256sum app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk | tee app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk.sha256

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/github/release/app-github-universal-release*.apk
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          )
          expected=6

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
            echo
            echo '> GitHub and FOSS APKs are uploaded individually without compression. Nightly remains a compressed artifact on regular CI runs.'
          } >> "$GITHUB_STEP_SUMMARY"

      # The universal APKs are what release downloads link to.
      - name: Upload GitHub universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-universal-release-apk
          path: app/build/outputs/apk/github/release/app-github-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-github-armeabi-v7a-release-apk
          path: app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-nightly-apk
          path: |
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-universal-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-arm64-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: flowtube-*-release-apk
          path: dist/
          merge-multiple: true

      # The flowtube-*.apk asset names are a public contract: release download
      # links and any third-party update feeds match assets by file name.
      # Do not rename or drop them without updating those references first.
      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mv dist/app-github-universal-release.apk   dist/flowtube.apk
          mv dist/app-foss-universal-release.apk     dist/flowtube-foss.apk
          mv dist/app-github-arm64-v8a-release.apk   dist/flowtube-arm64-v8a.apk
          mv dist/app-github-armeabi-v7a-release.apk dist/flowtube-armeabi-v7a.apk
          mv dist/app-foss-arm64-v8a-release.apk     dist/flowtube-foss-arm64-v8a.apk
          mv dist/app-foss-armeabi-v7a-release.apk   dist/flowtube-foss-armeabi-v7a.apk

      - name: Generate checksums
        run: |
          cd dist
          sha256sum flowtube*.apk > checksums.txt
          cat checksums.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          test -s release-notes.md
          grep -Fqx "# Flow ${RELEASE_VERSION}" release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Flow ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/flowtube.apk
            dist/flowtube-foss.apk
            dist/flowtube-arm64-v8a.apk
            dist/flowtube-armeabi-v7a.apk
            dist/flowtube-foss-arm64-v8a.apk
            dist/flowtube-foss-armeabi-v7a.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
